<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Com Sec AI - Create Meeting</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">Com Sec AI</div>
    <div class="header-actions">
      <select class="role-select">
        <option>Com Sec Maker</option>
        <option>Com Sec Checker</option>
        <option>Board Member</option>
        <option>Admin</option>
      </select>
      <a href="search.html" class="btn btn-secondary">Policy Search</a>
      <a href="index.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="panel" style="max-width: 800px; margin: 0 auto;">
      <div class="panel-header">
        <h2>Create New Meeting</h2>
      </div>

      <form id="create-meeting-form">
        <div class="grid-2 mb-4">
          <div class="form-group">
            <label>Meeting Number</label>
            <input type="text" id="meeting-number" placeholder="e.g. 16/2569">
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="meeting-date">
          </div>
        </div>

        <!-- Multi-template (2026-08-03) — เลือก template เอกสารที่จะใช้ตอน Generate Docx (Module 4)
             ทีหลัง เลือกได้ตอนสร้างเท่านั้น (แก้ทีหลังไม่ได้ผ่าน UI นี้) -->
        <div class="form-group mb-4">
          <label>Document Template</label>
          <select id="meeting-template-select"></select>
        </div>

        <div class="form-group">
          <label>Participants</label>
          <div id="participants-container">
            <div class="grid-2 mb-4 participant-row">
              <input type="text" class="participant-name" placeholder="Name">
              <div style="display: flex; gap: 1rem;">
                <input type="text" class="participant-position" placeholder="Position" style="flex: 1;">
                <input type="email" class="participant-email" placeholder="Email (สำหรับ Magic Link)" style="flex: 1;">
                <button type="button" class="btn btn-secondary remove-row-btn" style="color: var(--status-failed); border-color: var(--status-failed);">Remove</button>
              </div>
            </div>
          </div>
          <button type="button" id="add-participant-btn" class="btn btn-secondary">+ Add Participant</button>
        </div>

        <div class="form-group mt-4">
          <label>Meeting Agenda</label>
          <!-- เลขวาระ (2026-08-07, ผู้ใช้ขอ) — ช่อง label แยกจาก description พิมพ์อะไรก็ได้ (3.1,
               3.2, เรื่องที่ 5 ฯลฯ) ปล่อยว่าง = backend เติม "วาระที่ {ลำดับ}" ให้อัตโนมัติ -->
          <div id="agenda-container">
            <div class="agenda-row" style="display: flex; gap: 1rem; margin-bottom: 1rem;">
              <input type="text" class="agenda-label" placeholder="เลขวาระ (ไม่บังคับ)" style="width: 160px;">
              <input type="text" class="agenda-item" placeholder="Agenda item" style="flex: 1;">
              <button type="button" class="btn btn-secondary remove-row-btn" style="color: var(--status-failed); border-color: var(--status-failed);">Remove</button>
            </div>
          </div>
          <button type="button" id="add-agenda-btn" class="btn btn-secondary">+ Add Agenda</button>
        </div>

        <p id="form-error" style="color: var(--status-failed);"></p>

        <div class="text-right mt-4" style="border-top: 1px solid var(--secondary-cyan-deep); padding-top: 1.5rem;">
          <a href="index.html" class="btn btn-secondary" style="margin-right: 1rem;">Cancel</a>
          <button type="submit" class="btn btn-primary">Save Meeting</button>
        </div>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
