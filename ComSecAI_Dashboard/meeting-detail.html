<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Com Sec AI - Meeting Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">Com Sec AI</div>
    <div class="header-actions">
      <select class="role-select">
        <option>Com Sec Maker</option>
        <option>Com Sec Checker</option>
        <option>Board Member</option>
        <option>Admin</option>
      </select>
      <a href="search.html" class="btn btn-secondary">Policy Search</a>
      <a href="index.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div class="flex-between mb-4">
      <div>
        <h2 style="display: inline-block; margin-right: 1rem;">
          <span id="meeting-title">Loading...</span>
          <span id="meeting-date" style="color: var(--text-muted); font-size: 1rem; font-weight: normal;"></span>
        </h2>
        <span id="meeting-status-badge" style="vertical-align: super;"></span>
        <div id="meeting-template-label" class="text-muted" style="font-size: 0.85rem;"></div>
      </div>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <!-- Re-upload/reprocess — ใหม่ (ไม่มีใน Stitch mockup เดิม) เพิ่มเข้ามาเพราะเดิมไม่มีทางแก้
             ไฟล์เสียง/reprocess ซ้ำได้เลยหลัง status เป็น transcribed แล้ว (dashboard's
             actionCellHtml() มีปุ่ม Re-upload ให้แค่ตอน status="failed" เท่านั้น) — ซ่อนไว้ก่อน
             แสดงเฉพาะตอน transcribed/failed เท่านั้น (คุมผ่าน app.js::loadMeetingDetail กันกดซ้อน
             ระหว่าง processing/uploaded ที่มีงานค้างอยู่แล้ว) -->
        <!-- เลือกโมเดล Gemini เอง (2026-08-05, ผู้ใช้ขอ — ดู app.js::getModelOptionsHtml()) แสดง/ซ่อน
             พร้อมกับ reupload-audio-btn เสมอ (คุม display เดียวกันใน app.js) -->
        <select id="reupload-model-select" title="เลือกโมเดลเจาะจง = ปิดการสลับโมเดลสำรองอัตโนมัติทั้งหมด (ใช้โมเดลนั้นตัวเดียว)" style="font-size: 0.85rem; padding: 0.4rem; display: none;"></select>
        <button id="reupload-audio-btn" class="btn btn-secondary" style="display: none;">Re-upload Audio</button>
        <button id="export-transcript-btn" class="btn btn-secondary">Export Transcript</button>
      </div>
    </div>

    <!-- Participants/Agenda — แก้ไขย้อนหลังได้ (2026-08-07, ผู้ใช้ขอ — เดิมกรอกได้แค่ตอนสร้างประชุม
         เท่านั้น meeting ที่ลืมกรอก/ข้ามไปกู้ไม่ได้เลย ต้องสร้างใหม่ทั้งใบ) ปุ่ม Edit สลับ container
         เป็น input rows ผ่าน renderParticipantsEdit()/renderAgendaEdit() ใน app.js (pattern เดียวกับ
         Speaker Mapping/Edit Transcript เดิม) ซ่อนปุ่มถ้า approval_status="Approved" แล้ว (ดู
         backend's _reject_if_approved()) -->
    <div class="panel">
      <div class="grid-2">
        <div>
          <div class="flex-between">
            <h4>Participants</h4>
            <button id="edit-participants-btn" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.25rem 0.6rem;">Edit</button>
          </div>
          <div id="participants-container"></div>
        </div>
        <div>
          <div class="flex-between">
            <h4>Agenda</h4>
            <button id="edit-agenda-btn" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.25rem 0.6rem;">Edit</button>
          </div>
          <div id="agenda-container"></div>
        </div>
      </div>
    </div>

    <!-- Audio/Video Playback Panel (ใหม่, ไม่มีใน Stitch mockup เดิม) — "preview ฟังไฟล์เสียงย้อนหลัง"
         อยู่นอก main-content-grid ตั้งใจ เพราะโชว์ได้ตั้งแต่ status=uploaded (ยังไม่ transcribed ก็ฟัง
         ได้แล้ว) ไม่ผูกกับ transcript เหมือน panel อื่น — คุม display ผ่าน app.js::setupAudioPlayer
         (ดูตาม meeting.audio_filename ตรงๆ ไม่ใช่ status) -->
    <div id="audio-player-panel" class="panel" style="display: none;">
      <div class="panel-header">
        <h3>ฟังไฟล์เสียงย้อนหลัง (Playback)</h3>
      </div>
      <audio id="meeting-audio-player" controls preload="metadata" style="width: 100%;"></audio>
      <p id="audio-player-error" class="text-muted" style="color: var(--status-failed); margin-bottom: 0;"></p>
    </div>

    <!-- แสดงเมื่อยังไม่มี transcript (draft/uploaded/processing/failed) แทน 2 panel หลัก -->
    <div id="status-placeholder" class="panel text-muted" style="display: none;"></div>

    <!-- Main Content — แสดงเฉพาะตอน status = transcribed (คุม display ผ่าน app.js) -->
    <div id="main-content-grid" class="grid-2" style="display: none;">
      <!-- Speaker Mapping Panel -->
      <div class="panel" style="align-self: start;">
        <div class="panel-header">
          <h3>Speaker Mapping</h3>
        </div>
        <div id="mapping-container"></div>
      </div>

      <!-- Transcript Panel -->
      <div class="panel">
        <div class="panel-header flex-between">
          <div>
            <h3 style="margin-bottom: 0.25rem;">Meeting Transcript</h3>
            <!-- โมเดล Gemini ที่ transcribe สำเร็จจริง (2026-08-05, ผู้ใช้ขอให้บันทึก/แสดงทุกที่ —
                 ดู backend/models.py's transcription_model_used) ซ่อนเงียบๆถ้าเป็น null (meeting
                 เก่าก่อนมี field นี้ หรือยังไม่เคย transcribe สำเร็จ) ไม่ error -->
            <p id="transcript-model-used" class="text-muted" style="font-size: 0.8rem; margin: 0; display: none;"></p>
          </div>
          <button id="edit-transcript-btn" class="btn btn-secondary">Edit</button>
        </div>
        <div id="transcript-container" style="max-height: 500px; overflow-y: auto; padding-right: 1rem;"></div>
      </div>
    </div>

    <!-- Minutes Panel — Module 3 (ใหม่, ไม่มีใน Stitch mockup เดิม เพิ่มเข้ามาเอง) แสดง/ซ่อนพร้อมกับ
         main-content-grid ด้านบน (คุมผ่าน app.js::renderMainContent เดียวกัน) -->
    <div id="minutes-panel" class="panel" style="display: none;">
      <div class="panel-header flex-between">
        <h3>Minutes of Meeting (AI Draft)</h3>
        <button id="generate-minutes-btn" class="btn btn-primary">Generate Minutes</button>
      </div>
      <div id="minutes-container"></div>
    </div>

    <!-- Documents & Approval Panel — Module 4-5 (ใหม่, ไม่มีใน Stitch mockup เดิม เพิ่มเข้ามาเอง)
         แสดง/ซ่อนพร้อมกับ minutes-panel ด้านบน (คุมผ่าน app.js::renderMainContent เดียวกัน) -->
    <div id="documents-panel" class="panel" style="display: none;">
      <div class="panel-header flex-between">
        <h3>เอกสารและการอนุมัติ (Module 4-5)</h3>
        <span id="approval-status-badge"></span>
      </div>
      <div id="documents-container"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
