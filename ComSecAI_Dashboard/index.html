<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Com Sec AI - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">Com Sec AI</div>
    <div class="header-actions">
      <select class="role-select">
        <option>Com Sec Maker</option>
        <option>Com Sec Checker</option>
        <option>Board Member</option>
        <option>Admin</option>
      </select>
      <a href="search.html" class="btn btn-secondary">Policy Search</a>
      <a href="create-meeting.html" class="btn btn-primary">+ Create New Meeting</a>
    </div>
  </header>

  <main class="container">
    <div class="flex-between mb-4">
      <h2>Board Meetings</h2>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Meeting Number</th>
            <th>Date</th>
            <th>Status</th>
            <th>Speaker Matching</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="meetings-tbody">
          <tr><td colspan="5" class="text-muted">กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
